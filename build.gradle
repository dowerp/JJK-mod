plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT'
}

version = project.version
group = project.group

base {
	archivesName = 'jjk-mod'
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"sukuna" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	// GeckoLib и Player Animation Library лежат в libs/ (jar'ы из релизов под 1.21.11)
	flatDir {
		dirs 'libs'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation name: 'geckolib-fabric-1_21_11-5_4_5'
	modImplementation name: 'PlayerAnimationLibFabric-1_1_11_mc_1_21_11'
	implementation name: 'mochafloats-4.1.5'
}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}